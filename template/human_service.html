<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מוקד אנושי</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bot.css">
  <link rel="stylesheet" href="service_queue.css?v=2">
</head>
<body class="dashboard-page">
  {% set active_nav = "human_service" %}
  {% include "_dashboard_top_nav.html" %}

  <div class="page">
    <h2 class="title">מוקד אנושי</h2>
    <div class="counter">לקוחות בהמתנה: <span id="waiting-count">0</span></div>
    <input type="text" id="search" placeholder="חיפוש לפי לקוח, Domain או חיפ..." />
    <div class="table-card">
      <table class="customers-table">
        <colgroup>
          <col class="service-name-col">
          <col class="service-domain-col">
          <col class="service-number-col">
          <col class="service-status-col">
        </colgroup>
        <thead>
          <tr>
            <th>שם לקוח</th>
            <th>Domain</th>
            <th>חיפ</th>
            <th>סטטוס</th>
          </tr>
        </thead>
        <tbody id="customers-body"></tbody>
      </table>
    </div>
    <div id="empty-message" class="empty" style="display:none">אין לקוחות בהמתנה</div>
  </div>

  <div id="human-service-confirm-modal" class="confirm-modal" style="display:none">
    <div class="confirm-card">
      <h3>אישור פעולה</h3>
      <p>אם לשנות סטטוס לבוצע</p>
      <div class="confirm-actions">
        <button id="human-service-confirm-no" class="confirm-btn ghost" type="button">לא</button>
        <button id="human-service-confirm-yes" class="confirm-btn" type="button">כן</button>
      </div>
    </div>
  </div>

  <script src="human_service.js?v=3"></script>
  <script src="/nav.js"></script>
</body>
</html>
