<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>מוקד בוט</title>
  <link rel="icon" type="image/jpeg" href="/favicon/favicon.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/home.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bot.css">
</head>
<body class="dashboard-page">
  {% set active_nav = "bot" %}
  {% include "_dashboard_top_nav.html" %}

  <div class="page">
    <h2 class="title">מוקד בוט</h2>
    <div class="counter">לקוחות בהמתנה: <span id="waiting-count">0</span></div>
    <input type="text" id="search" placeholder="חיפוש לקוח..." />
    <div class="table-card">
      <table class="customers-table">
        <thead>
          <tr>
            <th>לקוח</th>
            <th>Domain</th>
            <th>DID</th>
            <th>סטטוס</th>
          </tr>
        </thead>
        <tbody id="customers-body"></tbody>
      </table>
    </div>
    <div id="empty-message" class="empty" style="display:none">אין לקוחות בהמתנה</div>
  </div>

  <div id="bot-confirm-modal" class="confirm-modal" style="display:none">
    <div class="confirm-card">
      <h3>Are you sure?</h3>
      <p>Do you want to mark this BOT row as Done?</p>
      <div class="confirm-actions">
        <button id="bot-confirm-no" class="confirm-btn ghost" type="button">No</button>
        <button id="bot-confirm-yes" class="confirm-btn" type="button">Yes</button>
      </div>
    </div>
  </div>

  <script src="bot.js"></script>
  <script src="/nav.js"></script>
</body>
</html>
