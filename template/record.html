<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הקלטות פתיח</title>
<link rel="icon" type="image/jpeg" href="/favicon/favicon.jpg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/home.css">
<link rel="stylesheet" href="/record.css">
</head>
<body class="dashboard-page">

{% set active_nav = "recordings" %}
{% include "_dashboard_top_nav.html" %}

<div class="record-wrap">
  <h2>הקלטות פתיח</h2>
  <button class="load-btn" onclick="loadData()">Load Recordings</button>

  <div class="counter">לקוחות בהמתנה: <span id="waiting-count">0</span></div>
  <table id="table">
      <thead>
          <tr>
              <th>File</th>
              <th>Order</th>
              <th>Domain</th>
              <th>Action</th>
              <th>Status</th>
          </tr>
      </thead>
      <tbody id="table-body"></tbody>
  </table>
  <div id="empty-message" class="empty" style="display:none">אין לקוחות בהמתנה</div>
</div>

<div id="confirm-modal" class="confirm-modal" style="display:none">
  <div class="confirm-card">
    <h3>Are you sure?</h3>
    <p>Do you want to mark this recording as Done?</p>
    <div class="confirm-actions">
      <button id="confirm-no" class="confirm-btn ghost" type="button">No</button>
      <button id="confirm-yes" class="confirm-btn" type="button">Yes</button>
    </div>
  </div>
</div>

<script>
let pendingDone = null;

async function loadData() {
    const res = await fetch("/recordings-data");
    const data = await res.json();
    const tableBody = document.getElementById("table-body");
    const empty = document.getElementById("empty-message");
    const count = document.getElementById("waiting-count");

    let html = "";
    count.innerText = data.length || 0;

    if (!data.length) {
        tableBody.innerHTML = "";
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    data.forEach((r) => {
        html += `
        <tr>
            <td>${r.name}</td>
            <td>${r.order_id}</td>
            <td style="color:${r.domain ? "black" : "red"}">
                ${r.domain || "MISSING"}
            </td>
            <td class="actions-cell">
                <a href="/download-record/${r.file_id}/${r.domain || "nodomain"}">
                    Download
                </a>
            </td>
            <td class="status-cell">
                <button class="done-btn" onclick="askBeforeDone('${r.file_id}', this)">
                    Done
                </button>
            </td>
        </tr>
        `;
    });

    tableBody.innerHTML = html;
}

function askBeforeDone(fileId, buttonEl) {
    pendingDone = { fileId, buttonEl };
    document.getElementById("confirm-modal").style.display = "flex";
}

async function markDone(fileId, buttonEl) {
    buttonEl.disabled = true;
    const res = await fetch(`/mark-done/${fileId}`, {
        method: "POST"
    });

    if (!res.ok) {
        buttonEl.disabled = false;
        const body = await res.text();
        alert("Failed to move file to Done folder: " + body);
        return;
    }

    await loadData();
}

document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("confirm-no").addEventListener("click", () => {
        pendingDone = null;
        document.getElementById("confirm-modal").style.display = "none";
    });

    document.getElementById("confirm-yes").addEventListener("click", async () => {
        const task = pendingDone;
        pendingDone = null;
        document.getElementById("confirm-modal").style.display = "none";
        if (!task) return;
        await markDone(task.fileId, task.buttonEl);
    });

    loadData();
});
</script>
<script src="/nav.js"></script>

</body>
</html>
